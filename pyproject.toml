[project]
name = "zonesim"
version = "0.1.0"
description = "Табличная симуляция жизни аномальной Зоны"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.6.0",
    "pydantic>=2.0.0",
    "networkx>=3.0.0",
]

[project.scripts]
zonesim-ui = "zonesim.ui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
zonesim = ["data/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# UI перехватывает любые исключения загрузки, чтобы показать сообщение пользователю
"src/zonesim/ui/main_window.py" = ["BLE001"]
# Мутабельные дефолты в dataclass-моделях конфигурации не разделяются между экземплярами
# (dataclasses.copy.deepcopy на уровне поля) и используются как константы правил.
"src/zonesim/**/config*.py" = ["RUF012"]
"tests/**" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
